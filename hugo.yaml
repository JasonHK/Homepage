title: ImJason.HK
baseURL: https://imjason.hk/
theme: hugo-narrow

hasCJKLanguage: true
enableEmoji: true

permalinks:
  section:
    projects: /projects/
  page:
    projects: /projects/:slugorcontentbasename/

menus:
  main:
    - identifier: nav.home
      pageRef: /
      weight: 1
      params:
        icon: home
    - identifier: nav.about
      pageRef: /about
      weight: 2
      params:
        icon: about
    - identifier: nav.projects
      pageRef: /projects
      weight: 3
      params:
        icon: projects
    - identifier: nav.tags
      pageRef: /tags
      weight: 4
      params:
        icon: tags
  footer:
    - name: RSS Feed
      url: /index.xml
      weight: 1
      params:
        icon: rss

params:
  colorScheme: slate
  header:
    logo:
      image: /images/avatar.png
    showThemeSwitch: false
  author:
    name: author.name
    title: author.title
    description: author.summary
    avatar: /images/avatar.png
    social:
      - name: GitHub
        icon: github
        url: https://github.com/JasonHK
  home:
    contentOrder:
      - author-section
      - featured-projects

defaultContentLanguage: en
languages:
  en:
    languageCode: en
    languageName: English
    weight: 1
  zh:
    languageCode: zh-Hant-HK
    languageName: 中文
    weight: 2
