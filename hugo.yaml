title: ImJason.HK
baseURL: https://imjason.hk/
theme: hugo-narrow

hasCJKLanguage: true
enableEmoji: true

permalinks:
  section:
    projects: /projects/
  page:
    projects: /projects/:slug/

menus:
  main:
    - name: nav.projects
      pageRef: /projects
      weight: 1
      params:
        icon: projects

params:
  colorScheme: slate
  header:
    logo:
      image: /images/avatar.png
    showThemeSwitch: false
  author:
    name: author.name
    title: author.title
    description: "Focused on content and user experience."
    avatar: /images/avatar.png
    social:
      - name: GitHub
        icon: github
        url: https://github.com/JasonHK
  home:
    contentOrder:
      - author-section
      - featured-projects

defaultContentLanguage: en
languages:
  en:
    languageCode: en
    languageName: English
    weight: 1
  zh:
    languageCode: zh-Hant-HK
    languageName: 中文
    weight: 2
